        // Render Tabs
        function renderTabs() {
            const container = document.getElementById('categoryTabs');
            container.innerHTML = menuData.map((cat, idx) => `
                <button onclick="scrollToCategory('${cat.id}', this)" 
                        class="tab-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all duration-300 border ${idx === 0 ? 'gold-bg text-black border-[#d4af37]' : 'bg-[#161b22] text-gray-300 border-gray-700 hover:border-[#d4af37]'}">
                    <i class="fa-solid ${cat.icon} ml-1.5 text-xs"></i>
                    ${cat.category}
                </button>
            `).join('');
        }

        // Render Menu Content
        function renderMenu(dataToRender = menuData) {
            const container = document.getElementById('menuContainer');
            if(dataToRender.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa-solid fa-mug-hot text-4xl mb-3 text-gray-600"></i>
                        <p class="text-sm">لم نجد أي مشروب أو حلوى بهذا الاسم</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = dataToRender.map(cat => `
                <section id="${cat.id}" class="scroll-mt-36">
                    <div class="flex items-center space-x-3 space-x-reverse mb-4 pb-2 border-b border-[#d4af37]/30">
                        <i class="fa-solid ${cat.icon} text-lg text-[#d4af37]"></i>
                        <h2 class="text-lg font-bold text-white tracking-wide">${cat.category}</h2>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${cat.items.map(item => `
                            <div onclick="openModal('${item.name}', '${item.price}', '${item.desc}', '${item.img}', '${cat.category}')" 
                                 class="card-glass rounded-xl p-3 flex space-x-3 space-x-reverse cursor-pointer transition-all duration-300 group">
                                <div class="relative w-24 h-24 rounded-lg overflow-hidden flex-shrink-0 bg-gray-900 border border-gray-800">
                                    <img src="${item.img}" alt="${item.name}" 
                                         onerror="this.src='${fallbackImage}'"
                                         class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                                    ${item.isNew ? '<span class="absolute top-1 right-1 gold-bg text-black text-[9px] font-extrabold px-1.5 py-0.5 rounded">NEW</span>' : ''}
                                </div>
                                <div class="flex-1 flex flex-col justify-between py-0.5">
                                    <div>
                                        <div class="flex justify-between items-start mb-1">
                                            <h3 class="font-bold text-sm text-gray-100 group-hover:text-[#d4af37] transition">${item.name}</h3>
                                            <span class="text-xs font-bold text-[#d4af37] bg-[#d4af37]/10 px-2 py-0.5 rounded border border-[#d4af37]/20">${item.price}</span>
                                        </div>
                                        <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed">${item.desc}</p>
                                    </div>
                                    <div class="flex items-center text-[11px] text-[#d4af37]/80 font-medium">
                                        <span>اضغط للتكبير والتفاصيل</span>
                                        <i class="fa-solid fa-chevron-left text-[9px] mr-1"></i>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `).join('');
        }

        // Filter Menu by Search Input
        function filterMenu() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderMenu(menuData);
                return;
            }

            const filtered = menuData.map(cat => {
                const matchingItems = cat.items.filter(item => 
                    item.name.toLowerCase().includes(query) || 
                    item.desc.toLowerCase().includes(query)
                );
                return matchingItems.length > 0 ? { ...cat, items: matchingItems } : null;
            }).filter(Boolean);

            renderMenu(filtered);
        }

        // Scroll to category smoothly
        function scrollToCategory(catId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('gold-bg', 'text-black');
                b.classList.add('bg-[#161b22]', 'text-gray-300');
            });
            btn.classList.remove('bg-[#161b22]', 'text-gray-300');
            btn.classList.add('gold-bg', 'text-black');

            const target = document.getElementById(catId);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Open Modal
        function openModal(name, price, desc, img, category) {
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalImage').src = img;
            document.getElementById('modalCategory').innerText = category;
            
            const modal = document.getElementById('imageModal');
            modal.classList.remove('hidden');
        }

        // Close Modal
        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        // Initialize on Load
        window.onload = function() {
            renderTabs();
            renderMenu();
        };
    </script>
</body>
</html>
